# XcodeGen の spec（https://github.com/yonaskolb/XcodeGen）。.xcodeproj はコミットせず、CI と手元で生成する。
# 名前と Bundle ID は scripts/new-app.sh が書き換える（テンプレートの名前・Bundle ID の文字列を全部置き換える）。
name: ReversiDelve
options:
  developmentLanguage: ja
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
targets:
  ReversiDelve:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "迷宮リバーシ"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # 標準の HTTPS 以外の暗号を使わない前提。使うなら本人に戻す（輸出規制の申告が変わる）
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        # 地下の暗い地で起動する（苔の回廊の地と同じ色）
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.enludus.daily.012
        PRODUCT_NAME: ReversiDelve
        # iPhone だけ（iPad 対応にすると iPad のスクリーンショットも提出に要る）
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
  ReversiDelveTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: ReversiDelve
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.enludus.daily.012.tests
        GENERATE_INFOPLIST_FILE: YES
  # 主な流れのタップと撮影・主なボタンが画面の中にあるかの検査（UITests/MainFlowUITests.swift）
  ReversiDelveUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: ReversiDelve
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.enludus.daily.012.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ReversiDelve
schemes:
  ReversiDelve:
    build:
      targets:
        ReversiDelve: all
        ReversiDelveTests: [test]
        ReversiDelveUITests: [test]
    test:
      gatherCoverageData: true
      targets:
        - ReversiDelveTests
        - ReversiDelveUITests
